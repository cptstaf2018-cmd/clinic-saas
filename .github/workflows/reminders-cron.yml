name: Reminders cron

# Vercel Hobby only allows daily crons, so the 5-minute reminder job runs here.
# Requires repo secrets: APP_URL (e.g. https://www.clinic-ai-pro.com) and CRON_SECRET.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminders endpoint
        run: |
          curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/reminders"
